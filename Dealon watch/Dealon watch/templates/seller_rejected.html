{% extends "base.html" %}
{% block content %}
<div class="login-container" style="max-width: 500px; text-align: center;">
    <div style="font-size: 3em; margin-bottom: 16px;">❌</div>
    <h2 class="login-header" style="color: #cc0000;">Account Not Approved</h2>

    <div style="background: #fff5f5; border: 1px solid #ffcccc; border-radius: 4px; padding: 18px; margin-bottom: 20px; text-align: left;">
        <p style="font-size: 0.85em; font-weight: 600; color: #cc0000; margin-bottom: 6px;">Reason for Rejection:</p>
        <p style="font-size: 0.92em; color: #555; line-height: 1.7;">{{ reason }}</p>
    </div>

    <p style="font-size: 0.88em; color: #888; margin-bottom: 20px; line-height: 1.6;">
        Your seller account application was not approved. Please review the reason above and create a new account with the correct details.
    </p>

    <a href="{{ url_for('signup', user_role='seller') }}" class="btn btn-primary-gold" style="display: inline-block; margin-bottom: 10px;">
        Re-apply as Seller
    </a>
    <br>
    <a href="{{ url_for('index') }}" style="font-size: 0.85em; color: #888;">Back to Home</a>
</div>
{% endblock %}
