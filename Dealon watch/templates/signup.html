{% extends "base.html" %}

{% block content %}
<div class="login-container">
    <h2 class="login-header">{{ role }} Signup</h2>
    <p class="login-subtitle">Create a new {{ role }} account for DeaLon.</p>
    
    <!-- Form action hits the specific Flask route /signup/customer or /signup/seller -->
    <form method="POST" action="{{ url_for('signup', user_role=role.lower()) }}" class="login-form">
        
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <button type="submit" class="btn btn-submit-gold">Sign Up</button>
        
        <p class="signup-prompt">
            Already have an account? 
            <a href="{{ url_for('login', user_role=role.lower()) }}" class="signup-link">Log In Here</a>
        </p>
    </form>
</div>
{% endblock %}
